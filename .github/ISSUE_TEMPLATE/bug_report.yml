name: Bug report
description: Something in Kyro doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Kyro is in early development — many features are not implemented yet.
        Please check the [Planned Features](https://github.com/YatharthKaushal/kyro-terminal#planned-features)
        list before filing.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `pnpm tauri dev`
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "Windows 11 24H2 / Ubuntu 24.04 / macOS 15.2"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
    validations:
      required: true

  - type: textarea
    id: toolchain
    attributes:
      label: Toolchain versions
      description: Output of `rustc --version`, `node --version`, `pnpm --version`
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Logs or console output
      render: text
